- name: Build GUI
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          if ($env:GOOS -eq "windows") {
            if ($env:GOARCH -eq "amd64") {
              $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
              $env:CC = "C:\msys64\ucrt64\bin\gcc.exe"
            }
            if ($env:GOARCH -eq "arm64") {
              $env:PATH = "C:\msys64\clangarm64\bin;$env:PATH"
              $env:CC = "C:\msys64\clangarm64\bin\clang.exe"
            }
          }
          
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = "dist/socks5-vetter-gui-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}"
          
          if ($env:GOOS -eq "windows") {
            go build -trimpath -ldflags "-H=windowsgui" -o $output ./cmd/socks5-vetter
          } else {
            go build -trimpath -o $output ./cmd/socks5-vetter
          }
        shell: pwsh
